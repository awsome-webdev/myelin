<html>
    <head>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="icon" href="/favicon" type="image/x-icon">
        <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
        .sidebar-link.active { background: rgba(16, 185, 129, 0.1); color: #34d399; border-right: 3px solid #34d399; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        input, select, textarea { background: rgba(0,0,0,0.2) !important; color: white !important; border-color: rgba(255,255,255,0.1) !important; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #34d399 !important; }
        </style>
                <style>
            #body{
                display: grid;
                position: absolute;
                top: 0px;
                left: 0px;
                grid-template-rows: auto 1fr;
                row-gap: 10px;
                margin: 0px;
                width: 100vw;
                height: 100vh;
            }
            .note{
                border-radius: 10px;
                padding: 10px;
                display: grid;
                row-gap: 10px;
                justify-content: center;
                align-items: center;
                min-width: 10vw;
                max-width: 15vw;
                height: fit-content;
                max-height: 25vh;
            }
            #taskbar{
                background-color: rgb(12, 12, 12);
                top: 0;
                left: 0;
                width: 100%;
                height: fit-content;
                padding: 5px;
            }
            #notes {
                padding: 10px;
                display: flex;
                flex-wrap: wrap;
                flex-direction: row;
                gap: 10px;
                justify-items: flex-start;
                align-content: flex-start;
            }
            .btn {
                border-radius: 10px;
                padding: 10px;
            }
        </style>
    </head>
    <body id="body" class="bg-gray-900">
        <div id="taskbar">
            <button onclick="newnote()" class="glass btn">NEW</button>
        </div>
        <div id="notes">
        </div>
    </body>
</html>
<script>
init()
async function init(){
    const not = await fetch(`/api/notes`)
    notes = await not.json()
    for (const note in notes){
        console.log()
        title = notes[note].title
        id = notes[note].id
        ele = document.getElementById('notes')
        ele.innerHTML += `
            <div class="note glass">
                <h1 style="text-align: center;" >${title}</h1>
                <button onclick="edit('${id}')" class="glass btn">open</button>
                <button onclick="delnote('${id}')" class="glass btn">Delete</button>
            </div>
        `
    }
}
function edit(id){
    location.href = `/edit?id=${id}`
}
async function newnote(){
    const title = prompt('Note title?')
    if (title == null){return}
    const req = await fetch(`/api/createnote?title=${title}`)
    const id = await req.text()
    location.href = `/edit?id=${id}`
}
async function delnote(id) {
    const conf = confirm("are you sure you want to delete this?");
    if (conf) {
        const req = await fetch(`/api/delete?id=${id}`);
        
        // This forces the actual browser window to move to the redirected URL
        if (req.redirected) {
            window.location.href = req.url;
        } else {
            // Optional: fallback if you decide to change backend to return JSON
            window.location.reload(); 
        }
    }
}

</script>
